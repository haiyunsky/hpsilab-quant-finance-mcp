name: Documentation improvement
description: Report unclear, missing, outdated, or incorrect documentation
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: Page or file
      placeholder: "README.md, docs/claude.md, URL, or section heading"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or incorrect?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: Include a verified command or source link when relevant.
  - type: checkboxes
    id: secret_check
    attributes:
      label: Secret check
      options:
        - label: I did not include a real API key or private data.
          required: true

