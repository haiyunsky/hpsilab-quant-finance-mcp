name: Bug report
description: Report a reproducible defect in the MCP package or hosted integration
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include API keys, authorization headers, private portfolio data, or security vulnerabilities. Report vulnerabilities using SECURITY.md.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues and documentation.
          required: true
        - label: I removed all secrets and private data.
          required: true
        - label: This is not a security vulnerability.
          required: true
  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options:
        - Hosted Streamable HTTP
        - Local stdio / PyPI
        - Both
        - Unknown
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package or server version
      placeholder: "0.5.3"
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client and version
      placeholder: "Claude Code 1.x, VS Code 1.x, Cursor ..."
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include sanitized configuration, prompt, tool name, and steps.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or response
      description: Remove tokens, headers, account IDs, and private portfolio data.
      render: text

