
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "hpsilab-quant-finance-mcp"
version = "0.8.9"
description = "Open-source Python quantitative finance MCP server for US stock and ETF research, options analytics, implied volatility, Monte Carlo simulation, AI prediction, backtesting, and risk analysis."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Haiyun Hu" }
]
keywords = [
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "quantitative-finance",
    "financial-research",
    "us-equities",
    "etf-analysis",
    "stock-analysis",
    "options-analytics",
    "implied-volatility",
    "monte-carlo",
    "backtesting",
    "risk-analysis",
    "ai-agent",
    "claude-mcp",
    "cursor-mcp",
    "chatgpt-mcp"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
    "hpsilab-mcp>=0.11.0",
    "mcp>=1.27.2,<2",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "jsonschema>=4.20,<5",
    "ruff>=0.12,<1",
]

[project.scripts]
hpsilab-quant-finance-mcp = "hpsilab_quant_finance_mcp.server:main"

[project.urls]
Homepage = "https://hpsilab.com"
Repository = "https://github.com/haiyunsky/hpsilab-quant-finance-mcp"
"MCP Directory" = "https://glama.ai/mcp/servers/haiyunsky/hpsilab-quant-finance-mcp"
"Python REST SDK" = "https://pypi.org/project/hpsilab-mcp/"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"tests/*.py" = ["E402"]

[tool.hatch.build]
exclude = [
  "/tests",
  "/docs",
  "/examples",
  "/python",
  "/bk",
  "/typescript",
]
